[package]
name = "packet-dissector-rtp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["packet", "network", "dissector", "parser", "rtp"]
categories = ["network-programming", "parser-implementations"]
description = "RTP (RFC 3550) dissector for packet-dissector"

[dependencies]
packet-dissector-core = { workspace = true }
packet-dissector-rtcp = { workspace = true, optional = true }

[features]
# Hand packets whose second octet is an RTCP packet type (192-223) to the
# RTCP dissector (RFC 5761, Section 4).
rtcp-mux = ["dep:packet-dissector-rtcp"]

[dev-dependencies]
criterion = { workspace = true }
packet-dissector-test-alloc = { workspace = true }

[[bench]]
name = "dissect"
harness = false
