[package]
name = "packet-dissector-diameter"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["packet", "network", "dissector", "parser", "diameter"]
categories = ["network-programming", "parser-implementations"]
description = "Diameter (RFC 6733) dissector for packet-dissector"

[features]
# Decode EAP-Payload / EAP-Reissued-Payload values as EAP (RFC 4072,
# Section 4.1 — https://www.rfc-editor.org/rfc/rfc4072#section-4.1).
eap = ["dep:packet-dissector-eap"]

[dependencies]
packet-dissector-core = { workspace = true }
packet-dissector-eap = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }
packet-dissector-test-alloc = { workspace = true }

[[bench]]
name = "dissect"
harness = false
