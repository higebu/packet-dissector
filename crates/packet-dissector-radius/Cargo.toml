[package]
name = "packet-dissector-radius"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["packet", "network", "dissector", "parser", "radius"]
categories = ["network-programming", "parser-implementations"]
description = "RADIUS (RFC 2865 / RFC 2866) dissector for packet-dissector"

[features]
# Decode EAP-Message values as EAP (RFC 3579, Section 3.1 —
# https://www.rfc-editor.org/rfc/rfc3579#section-3.1).
eap = ["dep:packet-dissector-eap"]

[dependencies]
packet-dissector-core = { workspace = true }
packet-dissector-eap = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }
packet-dissector-test-alloc = { workspace = true }

[[bench]]
name = "dissect"
harness = false
