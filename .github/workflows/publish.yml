name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz-release:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Detect crates new to crates.io
        id: detect
        run: ./scripts/publish-missing-crates.sh --detect-new

      - name: Publish crates missing from crates.io
        id: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          # Trusted Publishing cannot create new crates. This API token
          # (publish-new + trusted-publishing scopes) is handed to the step
          # only when a new crate exists, and is used only for those crates.
          # See the script header.
          NEW_CRATE_TOKEN: ${{ steps.detect.outputs.new_crates != '' && secrets.CARGO_REGISTRY_TOKEN || '' }}
          # Must match `environment:` of this job; used for the Trusted
          # Publishing config registered for new crates.
          TRUSTPUB_ENVIRONMENT: release
        run: ./scripts/publish-missing-crates.sh

      - name: Run release-plz (release)
        # Skipped while new crates are deferred by the crates.io rate limit:
        # release-plz would try to create them with the Trusted Publishing
        # token, which crates.io rejects. The next run picks them up.
        if: steps.publish.outputs.deferred == ''
        uses: release-plz/action@18641b6c63063cc5ff8786ebf69cd57e8541bae1 # v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  release-plz-pr:
    name: Create / update release PR
    runs-on: ubuntu-latest
    needs: [release-plz-release]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - name: Run release-plz (release-pr)
        uses: release-plz/action@18641b6c63063cc5ff8786ebf69cd57e8541bae1 # v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
